name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

jobs:
  backend:
    name: Backend (typecheck + test)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    env:
      # Dummy values so zod env validation + `prisma generate` succeed in CI —
      # no real DB or API keys are needed to typecheck and run the unit tests.
      DATABASE_URL: postgresql://ci:ci@localhost:5432/ci
      AUTH0_DOMAIN: ci.example.com
      AUTH0_AUDIENCE: https://ci.example.com/api
      FRONTEND_ORIGIN: http://localhost:3000
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm test

  frontend:
    name: Frontend (lint + typecheck + build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      NEXT_PUBLIC_API_BASE: http://localhost:4000/api
      NEXT_PUBLIC_AUTH0_DOMAIN: ci.example.com
      NEXT_PUBLIC_AUTH0_CLIENT_ID: ci-client-id
      NEXT_PUBLIC_AUTH0_AUDIENCE: https://ci.example.com/api
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npx tsc --noEmit
      - run: npm run build
